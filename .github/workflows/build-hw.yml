name: Build HarmonyOS HAP

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'hw/**'
      - 'VERSION'
      - 'scripts/build-hw.mjs'
      - 'scripts/sync-hw.mjs'
      - '.github/workflows/build-hw.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      custom_version:
        description: '自定义版本号（可选，例如 1.1，留空则默认按 VERSION 文件）'
        required: false
        type: string
        default: ''
      publish_release:
        description: '是否发布到 GitHub Release'
        required: true
        type: boolean
        default: true
      release_notes:
        description: '发布说明（可选）'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-hw:
    name: Build HarmonyOS HAP (unsigned)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout mobile 仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: suenmusic-mobile

      # 前端（web）在私有的 suenmusic-server 仓库里，检出在同一级目录
      - name: Checkout suenmusic-server 仓库（提供 web）
        uses: actions/checkout@v5
        with:
          repository: sunriseqis/suenmusic-server
          token: ${{ secrets.SUENMUSIC_REPO_TOKEN }}
          path: suenmusic-server

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'suenmusic-server/web/package-lock.json'

      - name: Determine Version
        id: get_version
        run: |
          COMMIT_COUNT=$(git -C suenmusic-mobile rev-list --count HEAD)
          VERSION_CODE=$((20000 + COMMIT_COUNT))
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT

          BASE_VER="1.0"
          if [ -f "suenmusic-mobile/VERSION" ]; then
            BASE_VER=$(cat suenmusic-mobile/VERSION | tr -d ' \n\r')
          fi

          CUSTOM_VER="${{ inputs.custom_version }}"
          if [ -n "$CUSTOM_VER" ]; then
            VERSION_NAME="$CUSTOM_VER"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/v}"
            VERSION_NAME="${TAG_VER}"
          else
            VERSION_NAME="${BASE_VER}"
          fi

          VERSION="v${VERSION_NAME}"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          echo "✔ 目标版本: ${VERSION} (VersionCode: ${VERSION_CODE})"

      - name: Build Web Assets and Sync to HarmonyOS
        run: |
          cd suenmusic-server/web
          npm ci
          npm run build
          cd "${GITHUB_WORKSPACE}/suenmusic-mobile"
          node scripts/sync-hw.mjs
          # 注入版本号至 AppScope/app.json5
          node -e '
            const fs = require("fs");
            const p = "hw/AppScope/app.json5";
            let c = fs.readFileSync(p, "utf8");
            c = c.replace(/"versionName":\s*"[^"]*"/, `"versionName": "${process.env.VERSION_NAME}"`);
            c = c.replace(/"versionCode":\s*\d+/, `"versionCode": ${process.env.VERSION_CODE}`);
            fs.writeFileSync(p, c, "utf8");
          '

      - name: Build HarmonyOS Unsigned HAP
        run: |
          echo "=== 启动 HarmonyOS 云端构建容器 (API 26r / command-line-tools) ==="
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/suenmusic-mobile:/workspace" \
            -w /workspace/hw \
            ghcr.io/dalongzhuazi/harmonyos-ci:api26r \
            bash -c '
              set -eo pipefail
              set -x
              ohpm install --all || true

              echo "--- 开始执行 Hvigor 构建 ---"
              hvigorw assembleHap \
                --mode module \
                -p product=default \
                -p buildMode=debug \
                --no-daemon \
                --stacktrace 2>&1 | tee /workspace/build.log

              echo "--- 查找构建产物 ---"
              mkdir -p /workspace/app
              FOUND_HAP=$(find /workspace/hw -type f -name "*.hap" | head -n 1)
              if [ -n "$FOUND_HAP" ] && [ -f "$FOUND_HAP" ]; then
                echo "找到产物: $FOUND_HAP"
                cp -v "$FOUND_HAP" "/workspace/app/SuenMusic-${{ env.VERSION }}-unsigned.hap"
              else
                echo "未在 /workspace/hw 找到 .hap，检索工作区:"
                find /workspace -type f -name "*.hap" || true
                echo "=== 输出构建日志末尾 120 行 ==="
                tail -n 120 /workspace/build.log 2>/dev/null || true
                exit 1
              fi
              chmod -R 777 /workspace/app /workspace/hw/build /workspace/hw/entry/build /workspace/build.log 2>/dev/null || true
            '

      # 产物校验
      - name: Verify Artifact
        run: |
          mkdir -p suenmusic-mobile/app
          ls -lh suenmusic-mobile/app/ 2>/dev/null || true
          HAP="suenmusic-mobile/app/SuenMusic-${{ env.VERSION }}-unsigned.hap"
          if [ ! -f "$HAP" ]; then
            echo "✖ 未找到 $HAP！输出构建日志末尾 120 行：" >&2
            tail -n 120 suenmusic-mobile/build.log 2>/dev/null || true
            exit 1
          fi

          # 校验 HAP 文件完整性（HAP 本质是 ZIP 包容器）
          unzip -t "$HAP" > /dev/null || { echo "✖ HAP 完整性校验失败"; exit 1; }
          echo "✔ HAP 完整性校验通过（包含 $(unzip -l "$HAP" | tail -1 | awk '{print $2}') 个条目）"

      - name: Upload HAP Artifact
        uses: actions/upload-artifact@v6
        with:
          name: SuenMusic-${{ env.VERSION }}-hap
          path: suenmusic-mobile/app/SuenMusic-${{ env.VERSION }}-unsigned.hap
          retention-days: 30

      # 清理 Release 上的冗余历史资产
      - name: Clean Up Redundant Release Assets
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        run: |
          node -e '
            const token = process.env.GITHUB_TOKEN;
            const repo = process.env.GITHUB_REPOSITORY;
            const tag = process.env.VERSION;
            const headers = {
              Authorization: `Bearer ${token}`,
              Accept: "application/vnd.github+json",
              "User-Agent": "SuenMusic-CI"
            };

            async function cleanup() {
              const res = await fetch(`https://api.github.com/repos/${repo}/releases/tags/${tag}`, { headers });
              if (!res.ok) {
                console.log(`Release ${tag} 暂不存在或未创建，跳过清理`);
                return;
              }
              const release = await res.json();
              // 规范产物名单：Android release.apk / iOS release.ipa / 鸿蒙 unsigned.hap
              const allowedPatterns = [
                /^SuenMusic-v[\d.]+-release\.apk$/,
                /^SuenMusic-v[\d.]+-release\.ipa$/,
                /^SuenMusic-v[\d.]+-unsigned\.hap$/
              ];

              for (const asset of release.assets || []) {
                const isAllowed = allowedPatterns.some(re => re.test(asset.name));
                if (!isAllowed) {
                  console.log(`正在从 Release 清理冗余资产: ${asset.name} (ID: ${asset.id})...`);
                  const delRes = await fetch(`https://api.github.com/repos/${repo}/releases/assets/${asset.id}`, {
                    method: "DELETE",
                    headers
                  });
                  if (delRes.status === 204) {
                    console.log(`✔ 已成功清理: ${asset.name}`);
                  } else {
                    console.warn(`✖ 清理失败 ${asset.name}: HTTP ${delRes.status}`);
                  }
                }
              }
            }
            cleanup().catch(err => {
              console.error("清理冗余资产异常:", err);
            });
          '
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: SuenMusic ${{ env.VERSION }} 移动端
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            ### SuenMusic ${{ env.VERSION }} 移动端发布 🎉

            #### 📱 安装包（统一在 `app/` 目录）：
            - `SuenMusic-${{ env.VERSION }}-release.apk`：安卓正式安装包，下载后可直接在手机上点击安装。
            - `SuenMusic-${{ env.VERSION }}-release.ipa`：iOS 未签名安装包，可使用 AltStore / SideStore / TrollStore 等重签工具安装。
            - `SuenMusic-${{ env.VERSION }}-unsigned.hap`：鸿蒙 NEXT 未签名安装包，可使用 DevEco Studio 或自签工具在纯血鸿蒙设备上安装运行。

            > ⚠️ **请从本 Release 下载附件安装**。Actions 页面里的 Artifact 是 GitHub 额外套的一层 zip，直接改后缀丢给安装工具会报错。
            >
            > 由 GitHub Actions 自动化流水线构建。服务端 / Web 见 [suenmusic-server](https://github.com/sunriseqis/suenmusic-server) 仓库。
            ${{ inputs.release_notes && format('#### 📝 更新说明：\n{0}', inputs.release_notes) || '' }}
          files: |
            suenmusic-mobile/app/SuenMusic-${{ env.VERSION }}-unsigned.hap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
